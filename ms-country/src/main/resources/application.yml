server:
  port: 8083
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: COUNTRY-SERVICE
  datasource:
    url: jdbc:h2:mem:countries;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093,localhost:9094,localhost:9096}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        max.block.ms: 5000
        max.in.flight.requests.per.connection: 5
app:
  kafka:
    country-topic: ${COUNTRY_TOPIC:country-name-topic}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
    min-in-sync-replicas: ${KAFKA_MIN_ISR:2}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
