server:
  port: 8888
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: API-GATEWAY
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/cvs}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/cvs/protocol/openid-connect/certs}
  cloud:
    gateway:
      routes:
        - id: curriculum-vitae-service
          uri: lb://CURRICULUM-VITAE-SERVICE
          predicates:
            - Path=/cv/**
        - id: country-service
          uri: lb://COUNTRY-SERVICE
          predicates:
            - Path=/countries/**
app:
  security:
    audience: cvs-api
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
