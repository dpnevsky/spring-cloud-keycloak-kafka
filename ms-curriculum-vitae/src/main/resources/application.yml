server:
  port: 8084
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: CURRICULUM-VITAE-SERVICE
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8889}
  datasource:
    url: jdbc:h2:mem:cvs;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093,localhost:9094,localhost:9096}
    consumer:
      group-id: cv-country-events
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
  cloud:
    openfeign:
      client:
        config:
          COUNTRY-SERVICE:
            connectTimeout: 2000
            readTimeout: 3000
app:
  kafka:
    country-topic: ${COUNTRY_TOPIC:country-name-topic}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
resilience4j:
  circuitbreaker:
    instances:
      country-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - org.springframework.web.server.ResponseStatusException
  retry:
    instances:
      country-service:
        maxAttempts: 2
        waitDuration: 200ms
        ignoreExceptions:
          - org.springframework.web.server.ResponseStatusException
